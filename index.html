<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice News</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <button class="ib" id="menu" aria-label="Open history"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 7h18M3 12h18M3 17h18"/></svg></button>
  <div class="brand">VOICE NEWS</div>
  <button class="ib" id="stopTop" aria-label="Stop reading"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></button>
</header>
 
<div class="stage">
  <div class="wavewrap"><div id="orb"></div><canvas id="wave"></canvas></div>
  <div class="tr">
    <div id="text" class="dim">Say “news”, “cricket” or “tell me about Tesla”</div>
    <input id="editbox" aria-label="Edit your request" placeholder="Type and press Enter">
    <button class="edit" id="edit" type="button"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>Edit</button>
  </div>
</div>
 
<div class="sheet"><div class="sin">
  <div class="cur" id="cur"></div>
  <div class="list" id="list"></div>
</div></div>
 
<button class="chev" id="chev" aria-label="Show or hide news"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg></button>
<div class="dockwrap"><div class="dock">
  <button class="ib" id="home" aria-label="Reset"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M4 11 12 4l8 7v9H4Z"/></svg></button>
  <button id="mic" aria-label="Start listening"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  <button class="ib" id="gear" aria-label="Settings"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg></button>
</div></div>
 
<div class="scrim" id="scrim"></div>
<aside id="drawer" aria-label="News history"><h2>History <button id="clear" type="button">Clear</button></h2><p class="sub">Purani searches, dobara sunne ke liye tap karo.</p><ul id="history"></ul></aside>
<div id="set"><label for="rate">Speaking speed <span id="rv">1.0x</span></label><input id="rate" type="range" min="0.7" max="1.4" step="0.1" value="1"><p class="hint">Esc dabane se reading ruk jaati hai. Mic ke liye Chrome ya Edge use karo.</p></div>
 
<script src="script.js"></script>
</body>
</html>
